name: .NET CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/MeetingRecord/MeetingRecord.slnx

      - name: Build
        run: dotnet build src/MeetingRecord/MeetingRecord.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/MeetingRecord/MeetingRecord.slnx --configuration Release --no-build --verbosity normal

      - name: Documentation encoding check
        shell: pwsh
        run: ./scripts/Test-DocsEncoding.ps1

      - name: Vulnerability scan
        env:
          NUGET_HTTP_TIMEOUT_SECONDS: "180"
        run: dotnet list src/MeetingRecord/MeetingRecord.slnx package --vulnerable --include-transitive
